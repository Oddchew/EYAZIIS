{% extends "base.html" %}
{% block title %}{{ doc.title }}{% endblock %}
{% block content %}
<h1>{{ doc.title }}</h1>
<p class="meta">Язык: {{ doc.language }} · область: {{ doc.domain }} · id: {{ doc.id }}</p>
<p>
  <a class="btn" href="/summarize/{{ doc.id }}">Построить реферат</a>
  <a class="btn" href="/export/{{ doc.id }}">Скачать JSON</a>
  <a class="btn" href="/">К списку</a>
</p>
<div class="card">
  <pre class="preview" style="max-height:none">{{ doc.text }}</pre>
</div>
{% endblock %}
