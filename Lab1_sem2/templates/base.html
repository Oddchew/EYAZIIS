<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Поиск{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
<!-- Максимально кривая четырёхконечная звезда Ивашенко — летает по экрану -->
<div id="ivashenko-star" aria-hidden="true" title="★ тест Ивашенко">
    <svg viewBox="0 0 100 100" width="240" height="240">
        <!--
            Настоящая 4-конечная звезда (8 вершин):
            луч → впадина → луч → впадина → луч → впадина → луч → впадина
            Координаты специально кривые и асимметричные.
        -->
        <polygon points="
            50,2
            62,38
            98,50
            62,62
            50,98
            38,62
            2,50
            38,38
        " fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"
           stroke-linejoin="round"/>
        <!-- внутренний кривой контур той же формы -->
        <polygon points="
            50,16
            58,40
            84,50
            58,60
            50,84
            42,60
            16,50
            42,40
        " fill="none" stroke="#ffffff55" stroke-width="1.5" stroke-dasharray="5 4"/>
    </svg>
</div>

<div class="header">
    <h1>Поиск</h1>
    <span>Boolean · English</span>
</div>
<div class="nav">
    <a href="{{ url_for('search') }}" class="{% if active == 'search' %}active{% endif %}">Поиск</a>
    <a href="{{ url_for('docs_page') }}" class="{% if active == 'docs' %}active{% endif %}">Документы</a>
    <a href="{{ url_for('upload_page') }}" class="{% if active == 'upload' %}active{% endif %}">Загрузка</a>
    <a href="{{ url_for('metrics_page') }}" class="{% if active == 'metrics' %}active{% endif %}">Метрики</a>
    <a href="{{ url_for('help_page') }}" class="{% if active == 'help' %}active{% endif %}">Справка</a>
</div>
<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
(function () {
    const star = document.getElementById('ivashenko-star');
    if (!star) return;

    let x = Math.random() * Math.max(0, window.innerWidth - 280);
    let y = Math.random() * Math.max(0, window.innerHeight - 280);
    let vx = (Math.random() * 3 + 1.5) * (Math.random() < 0.5 ? 1 : -1);
    let vy = (Math.random() * 3 + 1.5) * (Math.random() < 0.5 ? 1 : -1);
    let rot = 0;
    let rotSpeed = (Math.random() * 2 + 2) * (Math.random() < 0.5 ? 1 : -1);
    let wobble = 0;

    // пульсация размера и прозрачности
    let scale = 1;
    let scaleDir = 0.006;
    let opacityBase = 0.22;
    const BASE_SIZE = 240;

    function tick() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const size = BASE_SIZE * scale;

        x += vx;
        y += vy;
        rot += rotSpeed * 0.5;
        wobble += 0.08;
        scale += scaleDir;
        if (scale > 1.35 || scale < 0.65) scaleDir = -scaleDir;

        // отскок от краёв с небольшой рандомной кривизной
       if (x <= 0) { 
            x = 0; 
            vx = Math.abs(vx); // летит вправо
            rotSpeed = (Math.random() - 0.5) * 2; 
        }
        if (x + size >= w) { 
            x = w - size; 
            vx = -Math.abs(vx); // летит влево
            rotSpeed = (Math.random() - 0.5) * 2; 
        }
        if (y <= 0) { 
            y = 0; 
            vy = Math.abs(vy); // летит вниз
            rotSpeed = (Math.random() - 0.5) * 2; 
        }
        if (y + size >= h) { 
            y = h - size; 
            vy = -Math.abs(vy); // летит вверх
            rotSpeed = (Math.random() - 0.5) * 2; 
        }

        // лёгкое «пьяное» смещение
        const ox = Math.sin(wobble) * 6;
        const oy = Math.cos(wobble * 1.3) * 5;
        const skew = Math.sin(wobble * 0.7) * 12;

        // размер + лёгкая пульсация прозрачности
        const opacity = opacityBase + Math.sin(wobble * 0.5) * 0.15;

        star.style.opacity = opacity.toFixed(3);
        star.style.transform =
            `translate(${x + ox}px, ${y + oy}px) rotate(${rot}deg) scale(${scale}) skewX(${skew}deg)`;

        requestAnimationFrame(tick);
    }

    // клик — ускорить / сменить направление (как в тестах)
        // клик — сменить направление без изменения скорости
    star.addEventListener('click', function () {
        // Меняем знак скорости на противоположный или случайный, сохраняя модуль
        vx = Math.abs(vx) * (Math.random() < 0.5 ? 1 : -1);
        vy = Math.abs(vy) * (Math.random() < 0.5 ? 1 : -1);
        
        // Меняем направление вращения, сохраняя модуль скорости вращения
        rotSpeed = Math.abs(rotSpeed) * (Math.random() < 0.5 ? 1 : -1);
        
        star.classList.add('ivashenko-spin');
        setTimeout(() => star.classList.remove('ivashenko-spin'), 600);
    });

    requestAnimationFrame(tick);
})();
</script>
</body>
</html>
